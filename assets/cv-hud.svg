  <!-- Bottom console -->
  <rect x="35" y="230" width="560" height="50" fill="#0a0b16" stroke="#2a2c55"/>
  <text x="45" y="245" class="mono small" fill="#22c55e">&gt;&gt; FRAME: [53x7] | TARGET: shazamcodes64</text>
  <text x="45" y="258" class="mono small" fill="#22c55e">&gt;&gt; CCL_ENGINE: DETECTED 13 RAW CLUSTERS</text>
  <text x="45" y="271" class="mono small" fill="#22c55e">&gt;&gt; YOLOv8 COMMIT; STRETCHING 6 ROIs</text>

  <!-- Legend -->
  <text x="700" y="245" class="mono small">INTENSITY_MAP:</text>
  <rect x="700" y="252" width="10" height="10" class="cell"/>
  <rect x="715" y="252" width="10" height="10" fill="#22d3ee" opacity="0.4"/>
  <rect x="730" y="252" width="10" height="10" class="cyan"/>
  <rect x="745" y="252" width="10" height="10" class="mag"/>
  <rect x="760" y="252" width="10" height="10" class="pink"/>
  <text x="773" y="261" class="mono small">0  LOW  MED  HIGH  PEAK</text>

  <!-- Legend labels -->
  <rect x="700" y="270" width="10" height="8" fill="#22c55e" opacity="0.3"/>
  <text x="715" y="277" class="mono small" fill="#22c55e">COMMIT_CLUSTER</text>
  <rect x="810" y="270" width="10" height="8" class="cyan"/>
  <text x="825" y="277" class="mono small" fill="#22d3ee">DEV_STREAK</text>
  <rect x="895" y="270" width="10" height="8" class="pink"/>
  <text x="909" y="277" class="mono small" fill="#f43f5e">PEAK_BURST</text>
</svg>
