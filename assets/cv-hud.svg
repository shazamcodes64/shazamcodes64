<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <style>
      .mono { font-family: 'Share Tech Mono', 'Courier New', monospace; }
      .lbl  { fill: #00cc38; font-size: 10px; }
      .val  { fill: #00ff46; font-size: 18px; font-weight: bold; }
      .sm   { fill: #2a6636; font-size: 9px; }
      .smg  { fill: #00cc38; font-size: 9px; }
      .ttl  { fill: #00ff46; font-size: 13px; font-weight: bold; }
      .dayl { fill: #1a4428; font-size: 9px; }
      .clbx { fill: none; stroke: #00ff46; stroke-width: 0.8; stroke-dasharray: 3,2; opacity: 0.7; }

      /* phosphor intensity scale: none → faint → low → mid → full bright */
      .c0 { fill: #050f07; }
      .c1 { fill: #082810; }
      .c2 { fill: #0d5020; }
      .c3 { fill: #18963a; }
      .c4 { fill: #00ff46; }

      @keyframes runlight { to { stroke-dashoffset: -2960; } }
      .runborder {
        fill: none; stroke: #00ff46; stroke-width: 1;
        stroke-dasharray: 60 2900;
        animation: runlight 4s linear infinite;
        opacity: 0.45;
      }

      @keyframes blink { 0%,100%{opacity:0.6} 50%{opacity:0.1} }
      .blink { animation: blink 1.4s ease-in-out infinite; }

      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
      .pulse { animation: pulse 1.2s ease-in-out infinite; }

      @keyframes fadein { from{opacity:0} to{opacity:1} }
      .c1t { animation: fadein 0.3s 0.3s both; }
      .c2t { animation: fadein 0.3s 1.1s both; }
      .c3t { animation: fadein 0.3s 1.9s both; }
      .c4t { animation: fadein 0.3s 2.7s both; }
    </style>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- scanline texture -->
    <pattern id="scan" x="0" y="0" width="1000" height="3" patternUnits="userSpaceOnUse">
      <rect width="1000" height="1.5" fill="rgba(0,0,0,0.25)"/>
    </pattern>

    <clipPath id="gridClip">
      <rect x="192" y="64" width="780" height="132"/>
    </clipPath>

    <!-- scanner sweep gradient -->
    <linearGradient id="sweepG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00ff46" stop-opacity="0"/>
      <stop offset="70%"  stop-color="#00ff46" stop-opacity="0.06"/>
      <stop offset="92%"  stop-color="#00ff46" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#afffbb" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="320" rx="8" fill="#050e07"/>
  <rect width="1000" height="320" rx="8" fill="url(#scan)"/>
  <rect width="1000" height="320" rx="8" fill="none" stroke="#091a0c" stroke-width="1.5"/>

  <!-- Running light border -->
  <rect class="runborder" x="4" y="4" width="992" height="312" rx="7"/>

  <!-- Blinking corner brackets -->
  <g stroke="#00ff46" stroke-width="1.2" fill="none" class="blink">
    <path d="M14,14 L14,30 M14,14 L30,14"/>
    <path d="M986,14 L970,14 M986,14 L986,30"/>
    <path d="M14,306 L14,290 M14,306 L30,306"/>
    <path d="M986,306 L970,306 M986,306 L986,290"/>
  </g>

  <!-- Header -->
  <text x="34" y="38"  class="mono ttl" filter="url(#glow)">TARGET_DETECTION_HUD</text>
  <text x="34" y="52"  class="mono sm">SENSOR_ARRAY: COMMIT_LOGS | CAM_01 | shazamcodes64</text>
  <circle cx="930" cy="34" r="3.5" fill="#00ff46" class="pulse" filter="url(#glow)"/>
  <text x="940" y="38" class="mono smg">SYS_ACTIVE</text>
  <text x="886" y="52" class="mono sm">TRACKER_LOCK: OK</text>
  <line x1="14" y1="60" x2="986" y2="60" stroke="#00ff46" stroke-width="0.4" opacity="0.2"/>

  <!-- Left stats -->
  <text x="34" y="82"  class="mono lbl">ROIs ACTIVE</text>
  <text x="34" y="100" class="mono val" filter="url(#glow)">06</text>
  <text x="34" y="122" class="mono lbl">TOTAL_COMMITS</text>
  <text x="34" y="140" class="mono val" filter="url(#glow)">538</text>
  <text x="34" y="162" class="mono lbl">SCAN_STEPS</text>
  <text x="34" y="180" class="mono val" filter="url(#glow)">53×7 px</text>

  <!-- Day labels + tick -->
  <line x1="166" y1="64" x2="166" y2="198" stroke="#00ff46" stroke-width="0.4" opacity="0.15"/>
  <text x="170" y="98"  class="mono dayl">Mon</text>
  <text x="170" y="130" class="mono dayl">Wed</text>
  <text x="170" y="162" class="mono dayl">Fri</text>

  <!-- Month labels -->
  <text x="192" y="72" class="mono sm">Sep  Oct  Nov  Dec  Jan  Feb  Mar  Apr  May  Jun  Jul  Aug</text>

  <!-- ── CLUSTER 1: Sep — dense, full bright ── -->
  <g transform="translate(192,78)">
    <rect class="clbx" x="-2" y="-2" width="58" height="100" rx="2"/>
    <text x="0" y="-9" class="mono smg" font-size="8" filter="url(#glow)">COMMIT_CLUSTER 99.8%</text>
    <rect class="c4" x="0"  y="0"  width="11" height="11"/><rect class="c3" x="14" y="0"  width="11" height="11"/><rect class="c4" x="28" y="0"  width="11" height="11"/><rect class="c2" x="42" y="0"  width="11" height="11"/>
    <rect class="c3" x="0"  y="14" width="11" height="11"/><rect class="c4" x="14" y="14" width="11" height="11"/><rect class="c3" x="28" y="14" width="11" height="11"/><rect class="c4" x="42" y="14" width="11" height="11"/>
    <rect class="c2" x="0"  y="28" width="11" height="11"/><rect class="c4" x="14" y="28" width="11" height="11"/><rect class="c3" x="28" y="28" width="11" height="11"/><rect class="c4" x="42" y="28" width="11" height="11"/>
    <rect class="c4" x="0"  y="42" width="11" height="11"/><rect class="c3" x="14" y="42" width="11" height="11"/><rect class="c4" x="28" y="42" width="11" height="11"/><rect class="c3" x="42" y="42" width="11" height="11"/>
    <rect class="c3" x="0"  y="56" width="11" height="11"/><rect class="c4" x="14" y="56" width="11" height="11"/><rect class="c2" x="28" y="56" width="11" height="11"/><rect class="c4" x="42" y="56" width="11" height="11"/>
    <rect class="c4" x="0"  y="70" width="11" height="11"/><rect class="c3" x="14" y="70" width="11" height="11"/><rect class="c4" x="28" y="70" width="11" height="11"/><rect class="c2" x="42" y="70" width="11" height="11"/>
    <rect class="c2" x="0"  y="84" width="11" height="11"/><rect class="c4" x="14" y="84" width="11" height="11"/><rect class="c3" x="28" y="84" width="11" height="11"/><rect class="c4" x="42" y="84" width="11" height="11"/>
  </g>

  <!-- Sparse months Oct–Mar -->
  <g transform="translate(258,78)">
    <rect class="c1" x="14"  y="0"  width="11" height="11"/>
    <rect class="c1" x="56"  y="28" width="11" height="11"/>
    <rect class="c2" x="90"  y="14" width="11" height="11"/>
    <rect class="c1" x="132" y="42" width="11" height="11"/>
    <rect class="c1" x="170" y="0"  width="11" height="11"/>
    <rect class="c2" x="214" y="56" width="11" height="11"/>
    <rect class="c1" x="256" y="28" width="11" height="11"/>
    <rect class="c1" x="284" y="14" width="11" height="11"/>
    <rect class="c1" x="42"  y="56" width="11" height="11"/>
    <rect class="c1" x="108" y="70" width="11" height="11"/>
  </g>

  <!-- ── CLUSTER 2: Apr ── -->
  <g transform="translate(558,78)">
    <rect class="clbx" x="-2" y="12" width="58" height="74" rx="2"/>
    <text x="0" y="8" class="mono smg" font-size="8">COMMIT_CLUSTER 96.4%</text>
    <rect class="c3" x="0"  y="14" width="11" height="11"/><rect class="c4" x="14" y="14" width="11" height="11"/><rect class="c2" x="28" y="14" width="11" height="11"/><rect class="c3" x="42" y="14" width="11" height="11"/>
    <rect class="c4" x="0"  y="28" width="11" height="11"/><rect class="c2" x="14" y="28" width="11" height="11"/><rect class="c4" x="28" y="28" width="11" height="11"/><rect class="c3" x="42" y="28" width="11" height="11"/>
    <rect class="c2" x="0"  y="42" width="11" height="11"/><rect class="c4" x="14" y="42" width="11" height="11"/><rect class="c3" x="28" y="42" width="11" height="11"/><rect class="c4" x="42" y="42" width="11" height="11"/>
    <rect class="c3" x="0"  y="56" width="11" height="11"/><rect class="c3" x="14" y="56" width="11" height="11"/><rect class="c4" x="28" y="56" width="11" height="11"/><rect class="c2" x="42" y="56" width="11" height="11"/>
    <rect class="c4" x="0"  y="70" width="11" height="11"/><rect class="c2" x="14" y="70" width="11" height="11"/><rect class="c3" x="28" y="70" width="11" height="11"/><rect class="c4" x="42" y="70" width="11" height="11"/>
  </g>

  <!-- ── CLUSTER 3: Jun–Jul ── -->
  <g transform="translate(636,78)">
    <rect class="clbx" x="-2" y="-2" width="72" height="86" rx="2"/>
    <text x="0" y="-9" class="mono smg" font-size="8">COMMIT_CLUSTER 96.3%</text>
    <rect class="c4" x="0"  y="0"  width="11" height="11"/><rect class="c3" x="14" y="0"  width="11" height="11"/><rect class="c4" x="28" y="0"  width="11" height="11"/><rect class="c3" x="42" y="0"  width="11" height="11"/><rect class="c4" x="56" y="0"  width="11" height="11"/>
    <rect class="c2" x="0"  y="14" width="11" height="11"/><rect class="c4" x="14" y="14" width="11" height="11"/><rect class="c3" x="28" y="14" width="11" height="11"/><rect class="c4" x="42" y="14" width="11" height="11"/><rect class="c3" x="56" y="14" width="11" height="11"/>
    <rect class="c3" x="0"  y="28" width="11" height="11"/><rect class="c4" x="14" y="28" width="11" height="11"/><rect class="c4" x="28" y="28" width="11" height="11"/><rect class="c2" x="42" y="28" width="11" height="11"/><rect class="c4" x="56" y="28" width="11" height="11"/>
    <rect class="c4" x="0"  y="42" width="11" height="11"/><rect class="c3" x="14" y="42" width="11" height="11"/><rect class="c4" x="28" y="42" width="11" height="11"/><rect class="c4" x="42" y="42" width="11" height="11"/><rect class="c3" x="56" y="42" width="11" height="11"/>
    <rect class="c3" x="0"  y="56" width="11" height="11"/><rect class="c4" x="14" y="56" width="11" height="11"/><rect class="c2" x="28" y="56" width="11" height="11"/><rect class="c3" x="42" y="56" width="11" height="11"/><rect class="c4" x="56" y="56" width="11" height="11"/>
    <rect class="c4" x="0"  y="70" width="11" height="11"/><rect class="c2" x="14" y="70" width="11" height="11"/><rect class="c4" x="28" y="70" width="11" height="11"/><rect class="c3" x="42" y="70" width="11" height="11"/><rect class="c4" x="56" y="70" width="11" height="11"/>
  </g>

  <!-- ── CLUSTER 4: Aug — peak burst ── -->
  <g transform="translate(730,78)">
    <rect class="clbx" x="-2" y="-2" width="58" height="100" rx="2"/>
    <text x="0" y="-9" class="mono smg" font-size="8" filter="url(#glow)">COMMIT_CLUSTER 95.9%</text>
    <rect class="c4" x="0"  y="0"  width="11" height="11"/><rect class="c4" x="14" y="0"  width="11" height="11"/><rect class="c3" x="28" y="0"  width="11" height="11"/><rect class="c4" x="42" y="0"  width="11" height="11"/>
    <rect class="c3" x="0"  y="14" width="11" height="11"/><rect class="c4" x="14" y="14" width="11" height="11"/><rect class="c4" x="28" y="14" width="11" height="11"/><rect class="c3" x="42" y="14" width="11" height="11"/>
    <rect class="c4" x="0"  y="28" width="11" height="11"/><rect class="c3" x="14" y="28" width="11" height="11"/><rect class="c4" x="28" y="28" width="11" height="11"/><rect class="c4" x="42" y="28" width="11" height="11"/>
    <rect class="c4" x="0"  y="42" width="11" height="11"/><rect class="c4" x="14" y="42" width="11" height="11"/><rect class="c3" x="28" y="42" width="11" height="11"/><rect class="c4" x="42" y="42" width="11" height="11"/>
    <rect class="c3" x="0"  y="56" width="11" height="11"/><rect class="c4" x="14" y="56" width="11" height="11"/><rect class="c4" x="28" y="56" width="11" height="11"/><rect class="c3" x="42" y="56" width="11" height="11"/>
    <rect class="c4" x="0"  y="70" width="11" height="11"/><rect class="c4" x="14" y="70" width="11" height="11"/><rect class="c4" x="28" y="70" width="11" height="11"/><rect class="c4" x="42" y="70" width="11" height="11"/>
    <rect class="c3" x="0"  y="84" width="11" height="11"/><rect class="c4" x="14" y="84" width="11" height="11"/><rect class="c4" x="28" y="84" width="11" height="11"/><rect class="c3" x="42" y="84" width="11" height="11"/>
  </g>

  <!-- Scanner sweep: use animateTransform which GitHub allows -->
  <g clip-path="url(#gridClip)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="-800,0" to="800,0" dur="5s" repeatCount="indefinite"/>
      <line x1="192" y1="64" x2="192" y2="196"
        stroke="url(#sweepG)" stroke-width="2" opacity="0.85"/>
    </g>
  </g>

  <!-- Console -->
  <rect x="14" y="210" width="510" height="70" rx="3" fill="#020904" stroke="#091a0c" stroke-width="1"/>
  <text x="24" y="226" class="mono smg c1t">&gt;&gt; FRAME: [53x7] | TARGET: shazamcodes64</text>
  <text x="24" y="240" class="mono smg c2t">&gt;&gt; CCL_ENGINE: DETECTED 13 RAW CLUSTERS</text>
  <text x="24" y="254" class="mono smg c3t">&gt;&gt; YOLOv8 COMMIT; STRETCHING 6 ROIs</text>
  <text x="24" y="268" class="mono smg c4t">&gt;&gt; SCAN COMPLETED. ALL SYSTEMS NOMINAL.</text>

  <!-- Intensity legend -->
  <text x="540" y="222" class="mono sm">INTENSITY_MAP:</text>
  <rect x="540" y="230" width="9" height="9" class="c0" stroke="#091a0c" stroke-width="0.5"/>
  <rect x="553" y="230" width="9" height="9" class="c1"/>
  <rect x="566" y="230" width="9" height="9" class="c2"/>
  <rect x="579" y="230" width="9" height="9" class="c3"/>
  <rect x="592" y="230" width="9" height="9" class="c4" filter="url(#glow)"/>
  <text x="605" y="238" class="mono sm">0  1-2  3-5  6-8  9+</text>

  <rect x="540" y="250" width="9" height="7" fill="#00ff46" opacity="0.25" stroke="#00ff46" stroke-width="0.5"/>
  <text x="554" y="256" class="mono smg" font-size="8">COMMIT_CLUSTER</text>
  <rect x="660" y="250" width="9" height="7" class="c3"/>
  <text x="673" y="256" class="mono smg" font-size="8">DEV_STREAK</text>
  <rect x="742" y="250" width="9" height="7" class="c4" filter="url(#glow)"/>
  <text x="755" y="256" class="mono smg" font-size="8">PEAK_BURST</text>
</svg>
