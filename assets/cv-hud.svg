<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <style>
      .mono { font-family: 'Share Tech Mono', 'Courier New', monospace; }
      .lbl  { fill: #00cc38; font-size: 10px; }
      .val  { fill: #00ff46; font-size: 18px; font-weight: bold; }
      .sm   { fill: #2a6636; font-size: 9px; }
      .smg  { fill: #00cc38; font-size: 9px; }
      .ttl  { fill: #00ff46; font-size: 13px; font-weight: bold; }
      .dayl { fill: #1a4428; font-size: 9px; }
      .clbx { fill: none; stroke: #00ff46; stroke-width: 0.8; stroke-dasharray: 3,2; opacity: 0.7; }

      /* cell fills: dim / low / med / high / peak */
      .c0 { fill: #050f07; }
      .c1 { fill: #0a2410; }
      .c2 { fill: #0f4020; }
      .c3 { fill: #1a7a38; }
      .c4 { fill: #00ff46; }

      /* running light border */
      @keyframes runlight { to { stroke-dashoffset: -2960; } }
      .runborder {
        fill: none; stroke: #00ff46; stroke-width: 1;
        stroke-dasharray: 60 2900; stroke-dashoffset: 0;
        animation: runlight 4s linear infinite; opacity: 0.5;
      }

      /* scanner sweep */
      @keyframes sweep { 0%{transform:translateX(0)} 100%{transform:translateX(760px)} }
      .scanner { animation: sweep 5s linear infinite; opacity: 0; }
      @keyframes scanvis { 0%,100%{opacity:0} 5%,90%{opacity:1} }
      .scanner { animation: sweep 5s linear infinite, scanvis 5s linear infinite; }

      /* blink */
      @keyframes blink { 0%,100%{opacity:0.6} 50%{opacity:0.15} }
      .blink { animation: blink 1.4s ease-in-out infinite; }

      /* pulse */
      @keyframes pulse { 0%,100%{opacity:1;r:3.5} 50%{opacity:0.4;r:5} }
      .pulse { animation: pulse 1.2s ease-in-out infinite; }

      /* console lines */
      @keyframes fadein { from{opacity:0} to{opacity:1} }
      .c1t { animation: fadein 0.3s 0.3s both; }
      .c2t { animation: fadein 0.3s 1.1s both; }
      .c3t { animation: fadein 0.3s 1.9s both; }
      .c4t { animation: fadein 0.3s 2.7s both; }
    </style>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00ff46" stop-opacity="0"/>
      <stop offset="70%"  stop-color="#00ff46" stop-opacity="0.08"/>
      <stop offset="95%"  stop-color="#00ff46" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#aaffbb" stop-opacity="1"/>
    </linearGradient>

    <pattern id="scanlines" x="0" y="0" width="1000" height="3" patternUnits="userSpaceOnUse">
      <rect width="1000" height="1.5" fill="rgba(0,0,0,0.2)"/>
    </pattern>

    <clipPath id="gridClip">
      <rect x="196" y="66" width="772" height="130"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1000" height="320" rx="8" fill="#060e08"/>
  <rect width="1000" height="320" rx="8" fill="url(#scanlines)"/>
  <rect width="1000" height="320" rx="8" fill="none" stroke="#0a2010" stroke-width="1.5"/>

  <!-- Running light border -->
  <rect class="runborder" x="4" y="4" width="992" height="312" rx="7"/>

  <!-- Corner brackets -->
  <g stroke="#00ff46" stroke-width="1.2" fill="none" class="blink">
    <path d="M14,14 L14,30 M14,14 L30,14"/>
    <path d="M986,14 L970,14 M986,14 L986,30"/>
    <path d="M14,306 L14,290 M14,306 L30,306"/>
    <path d="M986,306 L970,306 M986,306 L986,290"/>
  </g>

  <!-- Header -->
  <text x="34" y="38" class="mono ttl" filter="url(#glow)">TARGET_DETECTION_HUD</text>
  <text x="34" y="52" class="mono sm">SENSOR_ARRAY: COMMIT_LOGS | CAM_01 | shazamcodes64</text>
  <circle cx="930" cy="34" r="3.5" fill="#00ff46" class="pulse" filter="url(#glow)"/>
  <text x="940" y="38" class="mono smg">SYS_ACTIVE</text>
  <text x="886" y="52" class="mono sm">TRACKER_LOCK: OK</text>
  <line x1="14" y1="60" x2="986" y2="60" stroke="#00ff46" stroke-width="0.5" opacity="0.2"/>

  <!-- Left stats -->
  <text x="34" y="82"  class="mono lbl">ROIs ACTIVE</text>
  <text x="34" y="100" class="mono val" filter="url(#glow)">06</text>
  <text x="34" y="120" class="mono lbl">TOTAL_COMMITS</text>
  <text x="34" y="138" class="mono val" filter="url(#glow)">538</text>
  <text x="34" y="158" class="mono lbl">SCAN_STEPS</text>
  <text x="34" y="176" class="mono val" filter="url(#glow)">53×7 px</text>

  <!-- Day labels -->
  <line x1="166" y1="66" x2="166" y2="196" stroke="#00ff46" stroke-width="0.5" opacity="0.15"/>
  <text x="170" y="98"  class="mono dayl">Mon</text>
  <text x="170" y="130" class="mono dayl">Wed</text>
  <text x="170" y="162" class="mono dayl">Fri</text>

  <!-- Month labels -->
  <text x="196" y="72" class="mono sm">Sep  Oct  Nov  Dec  Jan  Feb  Mar  Apr  May  Jun  Jul  Aug</text>

  <!-- CLUSTER 1: Sep — dense -->
  <g transform="translate(196,78)">
    <rect class="clbx" x="-2" y="-1" width="56" height="98" rx="2"/>
    <text x="0" y="-7" class="mono smg" font-size="8">COMMIT_CLUSTER 99.8%</text>
    <rect class="c4" x="0"  y="0"  width="10" height="10"/><rect class="c3" x="13" y="0"  width="10" height="10"/><rect class="c4" x="26" y="0"  width="10" height="10"/><rect class="c2" x="39" y="0"  width="10" height="10"/>
    <rect class="c3" x="0"  y="13" width="10" height="10"/><rect class="c4" x="13" y="13" width="10" height="10"/><rect class="c2" x="26" y="13" width="10" height="10"/><rect class="c4" x="39" y="13" width="10" height="10"/>
    <rect class="c2" x="0"  y="26" width="10" height="10"/><rect class="c3" x="13" y="26" width="10" height="10"/><rect class="c4" x="26" y="26" width="10" height="10"/><rect class="c3" x="39" y="26" width="10" height="10"/>
    <rect class="c4" x="0"  y="39" width="10" height="10"/><rect class="c2" x="13" y="39" width="10" height="10"/><rect class="c3" x="26" y="39" width="10" height="10"/><rect class="c4" x="39" y="39" width="10" height="10"/>
    <rect class="c3" x="0"  y="52" width="10" height="10"/><rect class="c4" x="13" y="52" width="10" height="10"/><rect class="c2" x="26" y="52" width="10" height="10"/><rect class="c3" x="39" y="52" width="10" height="10"/>
    <rect class="c4" x="0"  y="65" width="10" height="10"/><rect class="c3" x="13" y="65" width="10" height="10"/><rect class="c4" x="26" y="65" width="10" height="10"/><rect class="c2" x="39" y="65" width="10" height="10"/>
    <rect class="c2" x="0"  y="78" width="10" height="10"/><rect class="c4" x="13" y="78" width="10" height="10"/><rect class="c3" x="26" y="78" width="10" height="10"/><rect class="c4" x="39" y="78" width="10" height="10"/>
  </g>

  <!-- Sparse: Oct–Mar -->
  <g transform="translate(260,78)">
    <rect class="c1" x="12"  y="0"  width="10" height="10"/>
    <rect class="c1" x="52"  y="26" width="10" height="10"/>
    <rect class="c2" x="88"  y="13" width="10" height="10"/>
    <rect class="c1" x="130" y="39" width="10" height="10"/>
    <rect class="c1" x="168" y="0"  width="10" height="10"/>
    <rect class="c2" x="210" y="52" width="10" height="10"/>
    <rect class="c1" x="252" y="26" width="10" height="10"/>
    <rect class="c1" x="280" y="13" width="10" height="10"/>
  </g>

  <!-- CLUSTER 2: Apr -->
  <g transform="translate(554,78)">
    <rect class="clbx" x="-2" y="12" width="56" height="72" rx="2"/>
    <text x="0" y="8" class="mono smg" font-size="8">COMMIT_CLUSTER 96.4%</text>
    <rect class="c3" x="0"  y="13" width="10" height="10"/><rect class="c4" x="13" y="13" width="10" height="10"/><rect class="c2" x="26" y="13" width="10" height="10"/><rect class="c3" x="39" y="13" width="10" height="10"/>
    <rect class="c4" x="0"  y="26" width="10" height="10"/><rect class="c2" x="13" y="26" width="10" height="10"/><rect class="c4" x="26" y="26" width="10" height="10"/><rect class="c3" x="39" y="26" width="10" height="10"/>
    <rect class="c2" x="0"  y="39" width="10" height="10"/><rect class="c4" x="13" y="39" width="10" height="10"/><rect class="c3" x="26" y="39" width="10" height="10"/><rect class="c4" x="39" y="39" width="10" height="10"/>
    <rect class="c3" x="0"  y="52" width="10" height="10"/><rect class="c3" x="13" y="52" width="10" height="10"/><rect class="c4" x="26" y="52" width="10" height="10"/><rect class="c2" x="39" y="52" width="10" height="10"/>
    <rect class="c4" x="0"  y="65" width="10" height="10"/><rect class="c2" x="13" y="65" width="10" height="10"/><rect class="c3" x="26" y="65" width="10" height="10"/><rect class="c4" x="39" y="65" width="10" height="10"/>
  </g>

  <!-- CLUSTER 3: Jun–Jul -->
  <g transform="translate(634,78)">
    <rect class="clbx" x="-2" y="-1" width="69" height="84" rx="2"/>
    <text x="0" y="-7" class="mono smg" font-size="8">COMMIT_CLUSTER 96.3%</text>
    <rect class="c4" x="0"  y="0"  width="10" height="10"/><rect class="c3" x="13" y="0"  width="10" height="10"/><rect class="c4" x="26" y="0"  width="10" height="10"/><rect class="c3" x="39" y="0"  width="10" height="10"/><rect class="c4" x="52" y="0"  width="10" height="10"/>
    <rect class="c2" x="0"  y="13" width="10" height="10"/><rect class="c4" x="13" y="13" width="10" height="10"/><rect class="c3" x="26" y="13" width="10" height="10"/><rect class="c4" x="39" y="13" width="10" height="10"/><rect class="c2" x="52" y="13" width="10" height="10"/>
    <rect class="c3" x="0"  y="26" width="10" height="10"/><rect class="c4" x="13" y="26" width="10" height="10"/><rect class="c4" x="26" y="26" width="10" height="10"/><rect class="c2" x="39" y="26" width="10" height="10"/><rect class="c3" x="52" y="26" width="10" height="10"/>
    <rect class="c4" x="0"  y="39" width="10" height="10"/><rect class="c3" x="13" y="39" width="10" height="10"/><rect class="c4" x="26" y="39" width="10" height="10"/><rect class="c4" x="39" y="39" width="10" height="10"/><rect class="c3" x="52" y="39" width="10" height="10"/>
    <rect class="c3" x="0"  y="52" width="10" height="10"/><rect class="c4" x="13" y="52" width="10" height="10"/><rect class="c2" x="26" y="52" width="10" height="10"/><rect class="c3" x="39" y="52" width="10" height="10"/><rect class="c4" x="52" y="52" width="10" height="10"/>
    <rect class="c4" x="0"  y="65" width="10" height="10"/><rect class="c2" x="13" y="65" width="10" height="10"/><rect class="c4" x="26" y="65" width="10" height="10"/><rect class="c3" x="39" y="65" width="10" height="10"/><rect class="c4" x="52" y="65" width="10" height="10"/>
  </g>

  <!-- CLUSTER 4: Aug — peak burst -->
  <g transform="translate(726,78)">
    <rect class="clbx" x="-2" y="-1" width="56" height="98" rx="2"/>
    <text x="0" y="-7" class="mono smg" font-size="8">COMMIT_CLUSTER 95.9%</text>
    <rect class="c4" x="0"  y="0"  width="10" height="10"/><rect class="c4" x="13" y="0"  width="10" height="10"/><rect class="c3" x="26" y="0"  width="10" height="10"/><rect class="c4" x="39" y="0"  width="10" height="10"/>
    <rect class="c3" x="0"  y="13" width="10" height="10"/><rect class="c4" x="13" y="13" width="10" height="10"/><rect class="c4" x="26" y="13" width="10" height="10"/><rect class="c3" x="39" y="13" width="10" height="10"/>
    <rect class="c4" x="0"  y="26" width="10" height="10"/><rect class="c3" x="13" y="26" width="10" height="10"/><rect class="c4" x="26" y="26" width="10" height="10"/><rect class="c4" x="39" y="26" width="10" height="10"/>
    <rect class="c4" x="0"  y="39" width="10" height="10"/><rect class="c4" x="13" y="39" width="10" height="10"/><rect class="c3" x="26" y="39" width="10" height="10"/><rect class="c4" x="39" y="39" width="10" height="10"/>
    <rect class="c3" x="0"  y="52" width="10" height="10"/><rect class="c4" x="13" y="52" width="10" height="10"/><rect class="c4" x="26" y="52" width="10" height="10"/><rect class="c3" x="39" y="52" width="10" height="10"/>
    <rect class="c4" x="0"  y="65" width="10" height="10"/><rect class="c4" x="13" y="65" width="10" height="10"/><rect class="c4" x="26" y="65" width="10" height="10"/><rect class="c4" x="39" y="65" width="10" height="10"/>
    <rect class="c3" x="0"  y="78" width="10" height="10"/><rect class="c4" x="13" y="78" width="10" height="10"/><rect class="c4" x="26" y="78" width="10" height="10"/><rect class="c3" x="39" y="78" width="10" height="10"/>
  </g>

  <!-- Scanner sweep line -->
  <g clip-path="url(#gridClip)">
    <line class="scanner" x1="196" y1="66" x2="196" y2="196" stroke="url(#scanGrad)" stroke-width="2"/>
  </g>

  <!-- Console -->
  <rect x="14" y="208" width="500" height="70" rx="3" fill="#020904" stroke="#0a2010" stroke-width="1"/>
  <text x="24" y="224" class="mono smg c1t">&gt;&gt; FRAME: [53x7] | TARGET: shazamcodes64</text>
  <text x="24" y="238" class="mono smg c2t">&gt;&gt; CCL_ENGINE: DETECTED 13 RAW CLUSTERS</text>
  <text x="24" y="252" class="mono smg c3t">&gt;&gt; YOLOv8 COMMIT; STRETCHING 6 ROIs</text>
  <text x="24" y="266" class="mono smg c4t">&gt;&gt; SCAN COMPLETED. ALL SYSTEMS NOMINAL.</text>

  <!-- Legend -->
  <text x="530" y="224" class="mono sm">INTENSITY_MAP:</text>
  <rect x="530" y="232" width="8" height="8" class="c0" stroke="#0a2010" stroke-width="0.5"/>
  <rect x="542" y="232" width="8" height="8" class="c1"/>
  <rect x="554" y="232" width="8" height="8" class="c2"/>
  <rect x="566" y="232" width="8" height="8" class="c3"/>
  <rect x="578" y="232" width="8" height="8" class="c4" filter="url(#glow)"/>
  <text x="590" y="240" class="mono sm">0  1-2  3-5  6-8  9+</text>

  <rect x="530" y="250" width="8" height="6" fill="#00ff46" opacity="0.2" stroke="#00ff46" stroke-width="0.5"/>
  <text x="542" y="256" class="mono smg" font-size="8">COMMIT_CLUSTER</text>
  <rect x="648" y="250" width="8" height="6" class="c3"/>
  <text x="660" y="256" class="mono smg" font-size="8">DEV_STREAK</text>
  <rect x="730" y="250" width="8" height="6" class="c4" filter="url(#glow)"/>
  <text x="742" y="256" class="mono smg" font-size="8">PEAK_BURST</text>
</svg>
