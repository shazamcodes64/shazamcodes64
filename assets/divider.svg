<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="32" viewBox="0 0 1000 32">
  <defs>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- gradient for the traveling dot trail -->
    <linearGradient id="dotTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00ff46" stop-opacity="0"/>
      <stop offset="80%"  stop-color="#00ff46" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ff46" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left flat line -->
  <line x1="0" y1="16" x2="310" y2="16" stroke="#00ff46" stroke-width="0.6" opacity="0.2"/>

  <!-- Signal waveform center — all on one polyline so it's just a path, no copy button -->
  <polyline
    points="310,16 335,16 342,5 349,27 356,5 363,27 370,16 382,16 388,11 394,21 400,11 406,21 412,16 428,16 434,7 440,25 446,7 452,25 458,16 474,16 480,9 486,23 492,9 498,23 504,16 516,16 522,5 528,27 534,5 540,27 546,16 558,16 564,11 570,21 576,11 582,21 588,16 600,16 606,7 612,25 618,7 624,25 630,16 648,16 654,9 660,23 666,9 672,23 678,16 690,16"
    fill="none" stroke="#00ff46" stroke-width="1.1" opacity="0.45" filter="url(#glow)"/>

  <!-- Right flat line -->
  <line x1="690" y1="16" x2="1000" y2="16" stroke="#00ff46" stroke-width="0.6" opacity="0.2"/>

  <!-- Traveling dot: uses animateTransform (GitHub-safe) -->
  <circle cx="0" cy="16" r="2.8" fill="#00ff46" filter="url(#glow)">
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0,0"
      to="1000,0"
      dur="4.5s"
      repeatCount="indefinite"/>
  </circle>
</svg>
